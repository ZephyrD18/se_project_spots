<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spots is a simple, clean web project showcasing modern HTML and CSS structure."
    />
    <meta name="author" content="Issam Driwech" />
    <meta name="keywords" content="Spots, web design, HTML, CSS, project" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spots Logo" class="header__logo" />
      </header>

      <main class="content">
        <section class="profile page__section">
          <!-- UPDATED AVATAR BLOCK -->
          <div class="profile__avatar-container">
            <img
              src="./images/avatar.jpg"
              alt="Avatar Photo"
              class="profile__avatar"
            />
            <button type="button" class="profile__avatar-edit"></button>
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img src="./images/pencil.svg" alt="Edit Profile" />
              Edit Profile
            </button>
          </div>

          <button type="button" class="profile__add-button">
            <img src="./images/Plus.svg" alt="Plus Icon" />
            New Post
          </button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button
                    type="button"
                    aria-label="Like"
                    class="card__like-button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__title">2025 &copy; Spots</p>
      </footer>

      <!-- EDIT PROFILE MODAL -->
      <div id="edit-profile-modal" class="modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/CloseIcon.svg" alt="Close" />
          </button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="modal__error" id="profile-name-input-error"></span>
            </label>

            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span>
            </label>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- NEW POST MODAL -->
      <div id="new-post-modal" class="modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/CloseIcon.svg" alt="Close" />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" novalidate>
            <label for="post-link-input" class="modal__label">
              Image link
              <input
                id="post-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span class="modal__error" id="post-link-input-error"></span>
            </label>

            <label for="post-caption-input" class="modal__label">
              Caption
              <input
                id="post-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span class="modal__error" id="post-caption-input-error"></span>
            </label>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- PREVIEW MODAL -->
      <div id="preview-modal" class="modal modal_type_preview">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-button modal__close-button_type_preview"
          >
            <img src="./images/CloseWhite.svg" alt="Close" />
          </button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <!-- DELETE CONFIRMATION MODAL -->
      <div id="delete-modal" class="modal">
        <div class="modal__container modal__container_type_delete">
          <button
            type="button"
            class="modal__close-button modal__close-button_type_delete"
          >
            <img src="./images/CloseIcon.svg" alt="Close" />
          </button>
          <h2 class="modal__title modal__title_type_delete">
            Are you sure you want to delete this image?
          </h2>
          <form class="modal__form modal__form_type_delete">
            <div class="modal__actions">
              <button
                type="submit"
                class="modal__button modal__button_type_delete"
              >
                Delete
              </button>
              <button
                type="button"
                class="modal__button modal__button_type_cancel modal__cancel-button"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- AVATAR EDIT MODAL -->
      <div id="avatar-modal" class="modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/CloseIcon.svg" alt="Close" />
          </button>
          <h2 class="modal__title">Change profile picture</h2>
          <form class="modal__form" novalidate>
            <label class="modal__label">
              Avatar URL
              <input
                id="avatar-input"
                type="url"
                class="modal__input"
                placeholder="Enter image link"
                required
              />
              <span class="modal__error" id="avatar-input-error"></span>
            </label>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
